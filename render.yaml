services:
  - type: web
    name: localisus-backend
    runtime: docker
    dockerfilePath: ./api/projetointegrador.API/projetointegrador.API/Dockerfile
    dockerContext: ./api/projetointegrador.API/projetointegrador.API
    plan: free
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
